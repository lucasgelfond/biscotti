# Services the end-to-end tests run against: the on-device embeddings model (chat goes to the AI Gateway, as in
# production) and an empty Vaultwarden.
name: biscotti-tests

services:
  embeddings:
    build: ../deploy/llama
    image: biscotti/embeddings
    ports: ["127.0.0.1:8092:8080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 2s
      retries: 60

  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    environment:
      SIGNUPS_ALLOWED: "true"
      I_REALLY_WANT_VOLATILE_STORAGE: "true"
    ports: ["127.0.0.1:8093:80"]

  # Bitwarden's official CLI insists on HTTPS, so the tests reach Vaultwarden through Caddy's local CA as well.
  vaultwarden-tls:
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    command: caddy reverse-proxy --from localhost:8443 --to vaultwarden:80 --internal-certs
    volumes: [./.caddy:/data]
    ports: ["127.0.0.1:8094:8443"]
