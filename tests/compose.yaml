# Services the end-to-end tests run against: the on-device embeddings model (chat goes to the AI Gateway, as in
# production).
name: biscotti-tests

services:
  embeddings:
    build: ../plugins/embedding/llama
    image: biscotti/embeddings
    ports: ["127.0.0.1:8092:8080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 2s
      retries: 60

