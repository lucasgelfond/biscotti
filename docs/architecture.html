<title>biscotti architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
  /* Layout: one 16:9 blueprint sheet, sized for a tweet; it scrolls sideways on phones. */
  :root {
    --bg: #eaeff2;
    --sheet: #f6f8f9;
    --panel: #ffffff;
    --ink: #1c2a34;
    --muted: #5a6c78;
    --line: #9cb0bd;
    --grid: #dde5ea;
    --accent: #b8701f;
    --accent-soft: #f4e3cf;
    --vm-bg: #e2eaf0;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10181e; --sheet: #141e25; --panel: #1b2730; --ink: #e2e9ee; --muted: #93a6b3;
      --line: #465966; --grid: #1c2830; --accent: #e3a35a; --accent-soft: #3a2a17; --vm-bg: #22323d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10181e; --sheet: #141e25; --panel: #1b2730; --ink: #e2e9ee; --muted: #93a6b3;
    --line: #465966; --grid: #1c2830; --accent: #e3a35a; --accent-soft: #3a2a17; --vm-bg: #22323d;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  .sheet {
    max-width: 1600px;
    margin: 0 auto;
    background: var(--sheet);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 25px 25px;
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow-x: auto;
  }
  svg { display: block; width: 100%; min-width: 900px; height: auto; }
  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.4; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
  .group { fill: none; stroke: var(--line); stroke-width: 1.4; }
  .vms { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
  .gate { fill: var(--panel); stroke: var(--ink); stroke-width: 1.8; }
  .region { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 6 6; }
  .plugin { fill: var(--sheet); stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 6 5; }
  .p { font: 600 21px var(--display); fill: var(--muted); }
  .vm { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
  .vm.idle { stroke-dasharray: 8 6; stroke-width: 1.6; }
  .title { font: 700 64px var(--display); fill: var(--ink); letter-spacing: -0.01em; }
  .t { font: 600 26px var(--display); fill: var(--ink); }
  .m { font: 600 21px var(--display); fill: var(--ink); }
  .m.small { font-size: 17px; }
  .s { font: 500 16px var(--mono); fill: var(--muted); }
  .link { font: 500 16px var(--mono); fill: var(--accent); text-decoration: underline; }
  .label { font: 600 22px var(--display); fill: var(--muted); }
  .label.key { fill: var(--accent); }
  .wire { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .wire.key { stroke: var(--ink); stroke-width: 2.4; }
  .arrow { fill: var(--ink); }
  .arrow.key { fill: var(--ink); }
  a:focus-visible rect { stroke-width: 3; }
</style>

<div class="sheet" role="img" aria-label="biscotti (dashed boxes are plugins): iMessage arrives through Photon at a Raspberry Pi running NixOS on your tailnet. The core holds pi, the gate (keys and permissions), an encrypted SQLite store for memory, crons and the vault, and Firecracker task VMs (Debian with Cua). Plugins add croner, HTML artifacts and embeddings. The LLM, Gmail, Google Calendar, GitHub and Exa web search are reached only through the gate.">

      <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow key" d="M0 0L10 5L0 10z"/></marker>
