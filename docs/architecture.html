<title>biscotti architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
  /* Layout: one 16:9 blueprint sheet, sized for a tweet; it scrolls sideways on phones. */
  :root {
    --bg: #eaeff2;
    --sheet: #f6f8f9;
    --panel: #ffffff;
    --ink: #1c2a34;
    --muted: #5a6c78;
    --line: #9cb0bd;
    --grid: #dde5ea;
    --accent: #b8701f;
    --accent-soft: #f4e3cf;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10181e; --sheet: #141e25; --panel: #1b2730; --ink: #e2e9ee; --muted: #93a6b3;
      --line: #465966; --grid: #1c2830; --accent: #e3a35a; --accent-soft: #3a2a17;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10181e; --sheet: #141e25; --panel: #1b2730; --ink: #e2e9ee; --muted: #93a6b3;
    --line: #465966; --grid: #1c2830; --accent: #e3a35a; --accent-soft: #3a2a17;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  .sheet {
    max-width: 1600px;
    margin: 0 auto;
    background: var(--sheet);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 25px 25px;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow-x: auto;
  }
  svg { display: block; width: 100%; min-width: 900px; height: auto; }
  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.4; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
  .vm { fill: var(--panel); stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 8 6; }
  .chip { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .title { font: 700 64px var(--display); fill: var(--ink); letter-spacing: -0.01em; }
  .t { font: 600 26px var(--display); fill: var(--ink); }
  .big { font: 700 34px var(--display); fill: var(--ink); }
  .s { font: 500 17px var(--mono); fill: var(--muted); }
  .c { font: 500 17px var(--mono); fill: var(--ink); }
  .label { font: 600 19px var(--display); fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .label.key { fill: var(--accent); }
  .wire { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .wire.key { stroke: var(--accent); stroke-width: 2.2; }
  .arrow { fill: var(--ink); }
  .arrow.key { fill: var(--accent); }
</style>

<div class="sheet" role="img" aria-label="biscotti: you text from your iPhone through iMessage to a Raspberry Pi running NixOS. On it, a small core (agent, memory, gate) loads plugins. Task VMs run in Firecracker. Everything reaches the model and tools only through the gate, which holds the keys; Tailscale shows you the live desktops and pages.">
  <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker>
      <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow key" d="M0 0L10 5L0 10z"/></marker>
    </defs>

    <text class="title" x="60" y="110">biscotti</text>

    <!-- You -->
    <text class="label" x="60" y="232">You</text>
    <rect class="box" x="60" y="256" width="240" height="96" rx="8"/>
    <text class="t" x="84" y="313">iPhone</text>
    <rect class="box" x="60" y="440" width="240" height="96" rx="8"/>
    <text class="t" x="84" y="490">iMessage</text>
    <text class="s" x="84" y="516">Photon Spectrum</text>
    <rect class="box" x="60" y="694" width="240" height="96" rx="8"/>
    <text class="t" x="84" y="744">Tailscale</text>
    <text class="s" x="84" y="770">live desktops, pages</text>

    <!-- Raspberry Pi -->
    <rect class="frame" x="360" y="200" width="860" height="640" rx="12"/>
    <text class="label" x="390" y="240">Raspberry Pi 5 · NixOS</text>

    <rect class="core" x="390" y="262" width="800" height="150" rx="8"/>
    <text class="label key" x="414" y="296">core · 650 lines</text>
    <text class="big" x="414" y="352">agent</text>
    <text class="s" x="414" y="384">pi</text>
    <text class="big" x="660" y="352">memory</text>
    <text class="s" x="660" y="384">SQLite + FTS5</text>
    <text class="big" x="920" y="352">gate</text>
    <text class="s" x="920" y="384">keys · tools · approvals</text>

    <text class="label" x="390" y="458">plugins</text>
    <g>
      <rect class="chip" x="390" y="474" width="132" height="44" rx="22"/><text class="c" x="456" y="502" text-anchor="middle">spectrum</text>
      <rect class="chip" x="532" y="474" width="86" height="44" rx="22"/><text class="c" x="575" y="502" text-anchor="middle">exa</text>
      <rect class="chip" x="628" y="474" width="104" height="44" rx="22"/><text class="c" x="680" y="502" text-anchor="middle">wakes</text>
      <rect class="chip" x="742" y="474" width="132" height="44" rx="22"/><text class="c" x="808" y="502" text-anchor="middle">artifacts</text>
      <rect class="chip" x="884" y="474" width="118" height="44" rx="22"/><text class="c" x="943" y="502" text-anchor="middle">secrets</text>
      <rect class="chip" x="1012" y="474" width="140" height="44" rx="22"/><text class="c" x="1082" y="502" text-anchor="middle">embeddings</text>
    </g>

    <text class="label key" x="390" y="590">Firecracker task VMs</text>
    <rect class="vm" x="390" y="610" width="250" height="180" rx="8"/>
    <text class="t" x="414" y="664">desktop + pi</text>
    <text class="s" x="414" y="692">fresh every task</text>
    <rect class="vm" x="665" y="610" width="250" height="180" rx="8"/>
    <text class="t" x="689" y="664">desktop + pi</text>
    <rect class="vm" x="940" y="610" width="250" height="180" rx="8"/>
    <text class="t" x="964" y="664">desktop + pi</text>

    <!-- Cloud -->
    <text class="label" x="1280" y="232">Cloud</text>
    <rect class="box" x="1280" y="256" width="260" height="96" rx="8"/>
    <text class="t" x="1304" y="306">AI Gateway</text>
    <text class="s" x="1304" y="332">DeepSeek V4.1 Flash</text>
    <rect class="box" x="1280" y="440" width="260" height="96" rx="8"/>
    <text class="t" x="1304" y="490">the web</text>
    <text class="s" x="1304" y="516">Exa</text>
    <rect class="box" x="1280" y="610" width="260" height="96" rx="8"/>
    <text class="t" x="1304" y="660">your accounts</text>
    <text class="s" x="1304" y="686">Google · GitHub</text>

    <!-- Wires -->
    <path class="wire" d="M180 352V440" marker-start="url(#a)" marker-end="url(#a)"/>
    <path class="wire" d="M300 488H340V337H390" marker-start="url(#a)" marker-end="url(#a)"/>
    <path class="wire" d="M300 742H372" marker-end="url(#a)"/>
    <path class="wire key" d="M1190 304H1280" marker-end="url(#k)"/>
    <path class="wire" d="M1190 344H1235V488H1280" marker-end="url(#a)"/>
    <path class="wire" d="M1190 384H1255V658H1280" marker-end="url(#a)"/>
    <!-- Task VMs reach the model and tools only through the gate. -->
    <path class="wire key" d="M1171 610V412" marker-end="url(#k)"/>
  </svg>
</div>
