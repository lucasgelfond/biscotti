<title>permission-gate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Layout: a blueprint sheet. One wide diagram (scrolls sideways on phones), then three rules and a legend. */
  :root {
    --bg: #eaeff2;
    --sheet: #f6f8f9;
    --panel: #ffffff;
    --ink: #1c2a34;
    --muted: #5a6c78;
    --line: #9cb0bd;
    --grid: #dde5ea;
    --accent: #b8701f;
    --accent-soft: #f4e3cf;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10181e; --sheet: #141e25; --panel: #1b2730; --ink: #e2e9ee; --muted: #93a6b3;
      --line: #46596600; --line: #465966; --grid: #1c2830; --accent: #e3a35a; --accent-soft: #3a2a17;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10181e; --sheet: #141e25; --panel: #1b2730; --ink: #e2e9ee; --muted: #93a6b3;
    --line: #465966; --grid: #1c2830; --accent: #e3a35a; --accent-soft: #3a2a17;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 48px;
  }
  main { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
  header { display: grid; gap: 6px; }
  h1 { font: 700 34px/1.1 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); max-width: 68ch; }
  .sheet {
    background: var(--sheet);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow-x: auto;
  }
  svg { display: block; width: 100%; min-width: 980px; height: auto; }
  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .vm { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 7 5; }
  .planned { stroke-dasharray: 5 4; }
  .hot { fill: var(--accent-soft); stroke: var(--accent); }
  .t { font: 600 16px var(--display); fill: var(--ink); }
  .s { font: 500 11.5px var(--mono); fill: var(--muted); }
  .li { font: 400 12.5px var(--body); fill: var(--ink); }
  .label { font: 600 13px var(--display); fill: var(--ink); letter-spacing: 0.04em; text-transform: uppercase; }
  .vmlabel { font: 600 13px var(--display); fill: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
  .wire { fill: none; stroke: var(--ink); stroke-width: 1.3; }
  .wire.soft { stroke: var(--muted); stroke-dasharray: 4 4; }
  .wire.key { stroke: var(--accent); stroke-width: 1.6; }
  .tag { font: 500 11px var(--mono); fill: var(--muted); }
  .tag.key { fill: var(--accent); }
  .arrow { fill: var(--ink); }
  .arrow.key { fill: var(--accent); }
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .rule { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: grid; gap: 6px; min-width: 0; }
  .rule h2 { font: 600 18px/1.2 var(--display); margin: 0; }
  .rule p { margin: 0; color: var(--muted); font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font: 500 12px var(--mono); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .sw { width: 28px; height: 0; border-top: 1.6px solid var(--ink); }
  .sw.soft { border-top: 1.6px dashed var(--muted); }
  .sw.key { border-top-color: var(--accent); }
  .sw.box { height: 12px; border: 1.2px dashed var(--line); width: 22px; border-radius: 2px; }
</style>

<main>
  <header>
    <h1>permission-gate</h1>
  </header>

  <div class="sheet" role="img" aria-label="Future design. Diagram: your iPhone texts through Photon to the agent on the Raspberry Pi. The agent uses SQLite memory, on-device embeddings, Executor for Google and GitHub, Vaultwarden, and the Vercel AI Gateway. Tasks run in a Firecracker VM whose pi agent reaches the model only through the Caddy bridge.">
    <svg viewBox="0 0 1240 760" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker>
        <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow key" d="M0 0L10 5L0 10z"/></marker>
      </defs>

      <!-- You -->
      <text class="label" x="24" y="72">You</text>
      <rect class="box" x="24" y="110" width="200" height="80" rx="6"/>
      <text class="t" x="40" y="156">iPhone</text>
      <rect class="box" x="24" y="250" width="200" height="80" rx="6"/>
      <text class="t" x="40" y="296">Photon Spectrum</text>
      <rect class="box" x="24" y="650" width="200" height="80" rx="6"/>
      <text class="t" x="40" y="696">Laptop or phone</text>

      <!-- Raspberry Pi -->
      <rect class="frame" x="260" y="40" width="700" height="700" rx="10"/>
      <text class="label" x="284" y="72">Raspberry Pi 5 · the platform</text>

      <rect class="box" x="284" y="110" width="320" height="80" rx="6"/>
      <text class="t" x="300" y="156">agent</text>
      <rect class="box" x="284" y="206" width="276" height="64" rx="6"/>
      <text class="t" x="300" y="244">Tailscale Serve</text>

      <rect class="box" x="636" y="110" width="300" height="80" rx="6"/>
      <text class="t" x="652" y="156">Memory + History (SQLite FTS/vector)</text>
      <rect class="box" x="636" y="206" width="300" height="64" rx="6"/>
      <text class="t" x="652" y="244">embeddings</text>
      <rect class="box" x="636" y="286" width="300" height="80" rx="6"/>
      <text class="t" x="652" y="332">Executor</text>
      <rect class="box" x="636" y="382" width="300" height="70" rx="6"/>
      <text class="t" x="652" y="423">vaultwarden</text>

      <rect class="box hot" x="284" y="480" width="652" height="70" rx="6"/>
      <text class="t" x="300" y="521">permission-gate</text>

      <rect class="box" x="284" y="566" width="320" height="54" rx="6"/>
      <text class="t" x="300" y="599">Caddy</text>

      <!-- Task VM -->
      <rect class="vm" x="284" y="636" width="652" height="96" rx="8"/>
      <text class="vmlabel" x="760" y="660">Firecracker task VM</text>
      <rect class="box" x="304" y="652" width="280" height="64" rx="6"/>
      <text class="t" x="320" y="690">task agent</text>
      <rect class="box" x="600" y="672" width="140" height="44" rx="6"/>
      <text class="t" x="614" y="700">cua-spacesd</text>

      <!-- Cloud -->
      <text class="label" x="996" y="72">Cloud</text>
      <rect class="box" x="996" y="480" width="220" height="70" rx="6"/>
      <text class="t" x="1012" y="521">Vercel AI Gateway</text>
      <rect class="box" x="996" y="286" width="220" height="80" rx="6"/>
      <text class="t" x="1012" y="332">Google · GitHub</text>
      <rect class="box" x="996" y="400" width="220" height="70" rx="6"/>
      <text class="t" x="1012" y="441">Exa</text>

      <!-- Wires -->
      <path class="wire" d="M124 190V250" marker-start="url(#a)" marker-end="url(#a)"/>
      <path class="wire" d="M224 290H256V172H284" marker-end="url(#a)"/>
      <path class="wire" d="M284 150H272V684H304" marker-end="url(#a)"/>
      <path class="wire" d="M590 190V480" marker-start="url(#a)" marker-end="url(#a)"/>
      <path class="wire" d="M444 652V620" marker-end="url(#a)"/>
      <path class="wire" d="M444 566V550" marker-end="url(#a)"/>
      <path class="wire" d="M620 480V150H636" marker-end="url(#a)"/>
      <path class="wire" d="M620 238H636" marker-end="url(#a)"/>
      <path class="wire" d="M620 326H636" marker-end="url(#a)"/>
      <path class="wire" d="M620 417H636" marker-end="url(#a)"/>
      <path class="wire" d="M936 326H996" marker-end="url(#a)"/>
      <path class="wire key" d="M936 528H996" marker-end="url(#k)"/>
      <path class="wire" d="M936 495H972V435H996" marker-end="url(#a)"/>
      <path class="wire" d="M224 690H244V238H284" marker-end="url(#a)"/>
      <path class="wire" d="M584 694H600" marker-end="url(#a)"/>
    </svg>
  </div>


</main>
