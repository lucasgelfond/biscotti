# Bifrost (github.com/maximhq/bifrost), the gateway in front of LLM_BASE_URL (index.ts) at 127.0.0.1:4800. Its
# config.json is written from /var/lib/biscotti/.env before each start, so a changed setting takes a restart of setup.
services:
  bifrost-config:
    image: biscotti/agent
    command: ["node", "plugins/bifrost/write-config.ts", "/out"]
    env_file: /var/lib/biscotti/.env
    network_mode: none
    volumes: [/var/lib/biscotti/bifrost:/out]
    restart: "no"

  bifrost:
    # v2.4.0, linux/amd64 and linux/arm64.
    image: maximhq/bifrost:v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
    ports: ["127.0.0.1:4800:8080"]
    volumes: [/var/lib/biscotti/bifrost:/app/data]
    depends_on:
      bifrost-config: { condition: service_completed_successfully, restart: true }
    restart: unless-stopped
