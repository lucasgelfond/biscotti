# biscotti on a Mac (M3+): the biscotti-mac NixOS image in Lima, with nested virtualization for Firecracker. Plain mode:
# the image has no Lima guest agent. `limactl start --name=biscotti installers/local/lima.yaml`, then put .env and
# biscotti.json in /var/lib/biscotti (the setup app does this).
vmType: vz
plain: true
nestedVirtualization: true
cpus: 4
memory: 6GiB
disk: 20GiB
images:
  - location: https://biscotti.lucasgelfond.online/biscotti-mac.qcow2.zst
    arch: aarch64
mounts: []
