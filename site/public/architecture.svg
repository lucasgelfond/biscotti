<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1750 860" width="1750" height="860">
  <!-- biscotti's architecture, drawn like a terminal diagram. Dashed boxes are plugins; gray ones are for later. -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; letter-spacing: -0.01em; fill: #000; }
    .l { font-size: 22px; text-anchor: middle; }
    .s { font-size: 15px; text-anchor: middle; }
    .h { font-size: 20px; }
    .n { font-size: 15px; fill: #444; }
    rect, path { fill: none; stroke: #000; stroke-width: 1; shape-rendering: crispEdges; vector-effect: non-scaling-stroke; }
    rect.b { fill: #fff; }
    rect.later { stroke: #9a9a9a; }
    text.later { fill: #9a9a9a; }
    .vm { stroke: #b8701f; }
    .fc { fill: #b8701f; }
    .d { stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10" style="shape-rendering: auto"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V10" style="stroke: #000; stroke-opacity: 0.08; shape-rendering: auto"/>
    </pattern>
    <pattern id="fchatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" style="fill: #faf0e4; stroke: none"/>
      <path d="M0 0V8" style="stroke: #b8701f; stroke-opacity: 0.22; shape-rendering: auto"/>
    </pattern>
    <pattern id="machatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" style="fill: #e9eff9; stroke: none"/>
      <path d="M0 0V8" style="stroke: #2f5fb3; stroke-opacity: 0.22; shape-rendering: auto"/>
    </pattern>
  </defs>
  <rect x="0" y="50" width="1750" height="860" style="fill: #fff; stroke: none"/>

  <!-- outside -->
  <rect x="40" y="128" width="220" height="64"/><text class="l" x="150" y="168">iMessage</text>
  <rect x="40" y="220" width="220" height="90"/><text class="l" x="150" y="273">Photon</text>
  <rect x="40" y="340" width="220" height="72"/><text class="l" x="150" y="384">Concourse</text>
  <rect x="40" y="440" width="220" height="72"/><text class="l" x="150" y="484">zellij-agents</text>

  <!-- NixOS frame -->
  <rect x="300" y="110" width="1110" height="730"/>
  <text class="h" x="322" y="145">NixOS behind Tailscale</text>
  <text class="n" x="600" y="145">(running on Raspberry Pi or virtualized on Mac / the cloud)</text>

  <!-- core -->
  <rect class="d" x="320" y="172" width="1070" height="508" style="fill: url(#hatch)"/>
  <text class="h" x="340" y="203">core</text>

  <rect class="b" x="340" y="220" width="150" height="90"/>
  <text class="l" x="415" y="273">AHP</text>
  <rect class="b" x="530" y="220" width="180" height="90"/><text class="l" x="620" y="273">pi-durable</text>

  <rect class="vm" x="750" y="220" width="300" height="440" style="fill: url(#fchatch)"/>
  <text class="s fc" x="900" y="258">Firecracker</text>
  <rect class="b vm" x="768" y="284" width="264" height="166"/>
  <text class="l" x="900" y="342">light Debian VM</text>
  <text class="l" x="900" y="374">w/ Cua, voxl</text>
  <text class="l" x="900" y="406">and pi-env</text>
  <rect class="d b vm" x="768" y="470" width="124" height="170"/>
  <rect class="d b vm" x="908" y="470" width="124" height="170"/>

  <rect class="b" x="1090" y="220" width="280" height="440"/><text class="l" x="1230" y="258">gate</text>
  <rect class="b" x="1106" y="280" width="248" height="104"/>
  <text class="s" x="1230" y="303">encrypted SQLite</text>
  <rect class="b" x="1110" y="314" width="58" height="56"/><text class="s" x="1139" y="347">crons</text>
  <rect class="b" x="1172" y="314" width="58" height="56"/><text class="s" x="1201" y="347">memory</text>
  <rect class="b" x="1234" y="314" width="58" height="56"/><text class="s" x="1263" y="347">VMs</text>
  <rect class="b" x="1296" y="314" width="58" height="56"/><text class="s" x="1325" y="347">vault</text>
  <rect class="d b" x="1106" y="404" width="248" height="56"/><text class="s" x="1230" y="437">secure-fill</text>

  <!-- plugins -->
  <text class="h" x="340" y="728">plugins</text>
  <rect class="d" x="340" y="748" width="200" height="56"/><text class="l" x="440" y="783">artifacts</text>
  <rect class="d" x="560" y="748" width="200" height="56"/><text class="l" x="660" y="783">embeddings</text>

  <!-- cloud -->
  <text class="h" x="1460" y="203">cloud</text>
  <rect x="1460" y="220" width="250" height="136"/><text class="l" x="1585" y="252">llm provider</text>
  <rect x="1480" y="264" width="210" height="36" style="fill: url(#hatch)"/><text class="s" x="1585" y="287">pi-claude-code</text>
  <rect class="d later" x="1480" y="308" width="101" height="36"/><text class="s later" x="1530" y="331">Bifrost</text>
  <rect class="d later" x="1589" y="308" width="101" height="36"/><text class="s later" x="1640" y="331">Switchyard</text>
  <rect class="d" x="1460" y="372" width="250" height="64"/><text class="l" x="1585" y="412">Gmail</text>
  <rect class="d" x="1460" y="452" width="250" height="64"/><text class="l" x="1585" y="492">Google Calendar</text>
  <rect class="d" x="1460" y="532" width="250" height="64"/><text class="l" x="1585" y="572">GitHub</text>
  <rect class="d" x="1460" y="612" width="250" height="64"/><text class="l" x="1585" y="652">Exa</text>
  <rect class="vm" x="1460" y="696" width="250" height="90" style="fill: url(#fchatch)"/>
  <text class="s fc" x="1585" y="730">Firecracker</text>
  <text class="l" x="1585" y="764">EC2 overflow</text>
  <rect x="1460" y="802" width="250" height="90" style="fill: url(#machatch); stroke: #2f5fb3"/>
  <text class="s" x="1585" y="836" style="fill: #2f5fb3">macOS</text>
  <text class="l" x="1585" y="870">Swift via pi-env</text>

  <!-- wires; pi-durable and the VMs reach everything outside, and their state, only through the gate -->
  <path d="M150 192V220" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M260 250H340" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M260 376H312V280H340" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M260 476H326V300H340" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M490 265H530" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M710 265H750" marker-end="url(#a)"/>
  <path d="M620 220V194H1230V220" marker-end="url(#a)"/>
  <path d="M1050 440H1090" marker-end="url(#a)"/>
  <path d="M1370 244H1460" marker-end="url(#a)"/>
  <path d="M1370 404H1460" marker-end="url(#a)"/>
  <path d="M1370 484H1460" marker-end="url(#a)"/>
  <path d="M1370 564H1460" marker-end="url(#a)"/>
  <path d="M1370 644H1460" marker-end="url(#a)"/>
  <path d="M1230 660V741H1460" marker-end="url(#a)"/>
  <path d="M1230 741V847H1460" marker-end="url(#a)"/>
</svg>
