# Platform services. Everything listens on 127.0.0.1 only; `tailscale serve` exposes the UIs on the
# tailnet, and the Caddy bridge listens only on the sandbox bridge (172.16.0.1).
name: biscotti

services:
  # Host networking: Firecracker opens its tap devices in the host's network namespace, and the tailnet name resolves.
  agent:
    build: ../agent
    image: biscotti/agent
    network_mode: host
    # An init process reaps exited Firecracker processes.
    init: true
    environment:
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SPECTRUM_PROJECT_ID: ${SPECTRUM_PROJECT_ID:?}
      SPECTRUM_PROJECT_SECRET: ${SPECTRUM_PROJECT_SECRET:?}
      OWNER: ${OWNER:?}
      EMBEDDINGS_URL: http://127.0.0.1:8090
      EXECUTOR_URL: http://127.0.0.1:4788
      PASSTHROUGH_PORT: "4790"
      EXECUTOR_ORIGIN: https://${TAILNET_HOST:?}:8443
      EXECUTOR_API_KEY: ${EXECUTOR_API_KEY:-}
      EXECUTOR_ADMIN_PASSWORD: ${EXECUTOR_ADMIN_PASSWORD:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # Bitwarden's CLI requires HTTPS, which Tailscale Serve provides.
      VAULT_URL: https://${TAILNET_HOST:?}:9443
      VAULT_EMAIL: agent@biscotti.local
      VAULT_PASSWORD: ${VAULT_PASSWORD:?}
      TZ: ${TZ:-America/New_York}
      PAGES_URL: https://${TAILNET_HOST:?}:8445
      VM_DIR: /var/lib/biscotti/vm
      FIRECRACKER: /usr/local/bin/firecracker
    # Task VMs: KVM, the fc-task tap (opening it needs NET_ADMIN), the patched Firecracker and the snapshot.
    devices: [/dev/kvm, /dev/net/tun]
    cap_add: [NET_ADMIN]
    volumes:
      - agent:/data
      - /var/lib/biscotti/vm:/var/lib/biscotti/vm:ro
      - ${FIRECRACKER_BIN:-/usr/local/bin/firecracker}:/usr/local/bin/firecracker:ro
    restart: unless-stopped

  embeddings:
    build: ./llama
    image: biscotti/embeddings
    ports: ["127.0.0.1:8090:8080"]
    restart: unless-stopped

  executor:
    image: ghcr.io/usefulsoftwareco/executor-selfhost:2.0.0-beta.24@sha256:39d8ce360adf86df46e953f43551dad4440d04d7246d30fc7b0d6f3f5cfed3f7
    environment:
      BETTER_AUTH_URL: https://${TAILNET_HOST:?}:8443
      EXECUTOR_CATALOG_URL: https://catalog.executor.sh/index.json
      DO_NOT_TRACK: "1"
      EXECUTOR_DISABLE_ANALYTICS: "1"
    volumes: [executor:/app/data]
    ports: ["127.0.0.1:4788:4400"]
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    environment:
      DOMAIN: https://${TAILNET_HOST:?}:9443
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS:-true}
    volumes: [vaultwarden:/data]
    ports: ["127.0.0.1:8081:80"]
    restart: unless-stopped

  bridge:
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    network_mode: host
    # An init process reaps exited Firecracker processes.
    init: true
    environment:
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - agent:/agent:ro
    restart: unless-stopped

volumes:
  agent:
  executor:
  vaultwarden:
