# The biscotti app (iPhone, iPad and Mac): `TEAM_ID=… BUNDLE_PREFIX=… xcodegen` makes biscotti.xcodeproj (and the
# Info.plist and entitlements below). How to build, sign and install: the comment at the top of Sources/App.swift.
name: biscotti
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  biscotti:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    entitlements:
      path: biscotti.entitlements
      properties:
        aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: biscotti
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.biscotti
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: [biscottiTests, biscottiUITests]
  # Unit tests (the ACP client's parsing, the timeline), and, with ACP_URL set, the client against a running agent:
  #   xcodebuild test -project biscotti.xcodeproj -scheme biscotti -destination 'platform=iOS Simulator,name=iPhone 17' \
  #     -only-testing:biscottiTests TEST_RUNNER_ACP_URL=http://127.0.0.1:7999/acp
  biscottiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: biscotti }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.biscottiTests
        GENERATE_INFOPLIST_FILE: YES
  # The app against a running agent (ACP_URL), its screens saved to SHOTS: -only-testing:biscottiUITests
  # TEST_RUNNER_ACP_URL=… TEST_RUNNER_SHOTS=/some/dir
  biscottiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: biscotti }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.biscottiUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: biscotti
