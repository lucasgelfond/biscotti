# The biscotti app (iPhone, iPad and Mac): `brew install xcodegen && xcodegen` makes biscotti.xcodeproj. See README.md.
name: biscotti
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  biscotti:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    entitlements:
      path: biscotti.entitlements
      properties:
        aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: biscotti
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.biscotti
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
