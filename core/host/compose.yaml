# The gate and the main agent. Plugins that need a service of their own bring a compose.yaml, included for the plugins
# biscotti.json names. Everything listens on 127.0.0.1 (or the task VMs' links); Tailscale exposes what the owner opens.
name: biscotti

services:
  # Every key, the database, the channel and the plugins. Host networking: the gate listens on each VM slot's link, and
  # Firecracker opens taps in the slots' namespaces.
  gate:
    build:
      context: ../..
      dockerfile: core/Dockerfile
    image: biscotti/agent
    network_mode: host
    # An init process reaps exited Firecracker processes.
    init: true
    env_file: /var/lib/biscotti/.env
    environment:
      DATA_DIR: /data
      VM_DIR: /var/lib/biscotti/vm
      FIRECRACKER: /usr/local/bin/firecracker
    # Task VMs: KVM, the slots' network namespaces (entering one needs SYS_ADMIN, opening its tap NET_ADMIN), the
    # patched Firecracker and the snapshot.
    devices: [/dev/kvm, /dev/net/tun]
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - /var/lib/biscotti/data:/data
      - /var/lib/biscotti/biscotti.json:/app/biscotti.json:ro
      - type: bind
        source: /run/netns
        target: /run/netns
        read_only: true
        bind: { propagation: rslave }
      - /var/lib/biscotti/vm:/var/lib/biscotti/vm:ro
      - ${FIRECRACKER_BIN:?}:/usr/local/bin/firecracker:ro
      - /run/biscotti:/run/biscotti
    restart: unless-stopped

  # The main agent: no keys, no data and no network. It reaches the gate only through the socket in /run/biscotti, so
  # whatever steers it can't read a secret or approve anything.
  agent:
    image: biscotti/agent
    command: ["node", "core/src/agent-main.ts"]
    network_mode: none
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /tmp
      TZ: ${TZ:-America/New_York}
    volumes:
      - /run/biscotti:/run/biscotti
    depends_on: [gate]
    restart: unless-stopped
